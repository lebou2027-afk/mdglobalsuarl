const save=()=>{wr(KC,cfg);wr(KS,snap);try{localStorage.setItem(KU,cur)}catch(x){}};
const lab=()=>({ok:'☁ En ligne ✔',sync:'☁ Synchronisation…',err:'☁ ⚠ Erreur de synchro',offline:'☁ Hors ligne (en attente)',auth:'☁ ⚠ Reconnexion requise'}[st]||'');
const ui=()=>{['syst','syst2'].forEach(i=>{const x=document.getElementById(i);if(x)x.textContent=lab()})};
const set=s=>{st=s;ui()};
async function api(path,opt={},retry=true){
 const h={apikey:cfg.key,'Content-Type':'application/json',...(opt.headers||{})};
 if(cfg.at)h.Authorization='Bearer '+cfg.at;
 const r=await fetch(cfg.url+path,{...opt,headers:h,signal:AbortSignal.timeout?AbortSignal.timeout(20000):undefined});
 if(r.status==401&&retry&&cfg.rt){await refresh();return api(path,opt,false)}
 return r}
async function refresh(){
 const r=await fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cfg.rt})});
 if(!r.ok){cfg.at='';save();set('auth');throw new Error('auth')}
 const j=await r.json();cfg.at=j.access_token;cfg.rt=j.refresh_token;save()}
async function flush(){
 if(!on())return;
 const it=items(),up=[],ns={...snap};
 for(const k in it){const hh=hs(it[k]);if(snap[k]!==hh){const i=k.indexOf('/');up.push({collection:k.slice(0,i),id:k.slice(i+1),data:it[k],deleted:false});ns[k]=hh}}
 for(const k in snap)if(!(k in it)){const i=k.indexOf('/');up.push({collection:k.slice(0,i),id:k.slice(i+1),data:{},deleted:true});delete ns[k]}
 if(!up.length)return;
 set('sync');
 for(let i=0;i<up.length;i+=15){
  const r=await api('/rest/v1/sync_records?on_conflict=collection,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up.slice(i,i+15))});
  if(!r.ok)throw new Error('push '+r.status+' '+(await r.text()).slice(0,200))}
 snap=ns;save()}
function apply(rows){
 const it=items(),touched=new Set();let ch=false;
 rows.forEach(r=>{
  const k=r.collection+'/'+r.id,c=r.collection,d=r.data,loc=it[k],dirty=loc!==undefined&&snap[k]!==hs(loc);
  if(c=='meta'){
   if(r.id=='set'){if(dirty)return;const lb=DB.set.lastbk;DB.set={...d,lastbk:lb};snap[k]=hs(d);ch=true}
   else if(r.id=='cnt'){Object.keys(d||{}).forEach(x=>{DB.cnt[x]=Math.max(+DB.cnt[x]||0,+d[x]||0)});snap[k]=hs(d)}
   return}
  if(!COL.includes(c))return;
  const a=DB[c]=DB[c]||[],i=a.findIndex(x=>String(x.id)==r.id);
  if(r.deleted){if(!dirty){if(i>=0){a.splice(i,1);ch=true;touched.add(c)}delete snap[k]}return}
  if(dirty)return;
  if(i>=0){if(hs(a[i])==hs(d)){snap[k]=hs(d);return}a[i]=d}else a.push(d);
  snap[k]=hs(d);ch=true;touched.add(c)});
 touched.forEach(c=>DB[c].sort((x,y)=>(+x.id||0)-(+y.id||0)));
 nz();return ch}
const busyUI=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||!!$('#mdl').children.length||!!$('#prn').children.length||P=='vente'||!!DT[P]};
async function pull(){
 if(!on())return;let ch=false;
 for(;;){
  const r=await api('/rest/v1/sync_records?select=collection,id,data,deleted,updated_at&order=updated_at.asc&limit=300'+(cur?'&updated_at=gte.'+encodeURIComponent(cur):''));
  if(!r.ok)throw new Error('pull '+r.status);
  const rows=await r.json();
  if(rows.length){ch=apply(rows)||ch;cur=rows[rows.length-1].updated_at}
  if(rows.length<300)break}
 if(ch){try{localStorage.setItem(K,JSON.stringify(DB))}catch(x){}ap();pend=true}
 save();
 if(pend){if(!U)pend=false;else if(!busyUI()){pend=false;nav();go(P)}}}
const cycle=async()=>{await flush();await pull()};
const run=f=>{pc++;q=q.then(f).then(()=>{if(st!='auth')set('ok')},x=>{console.warn('sync',x);if(st!='auth')set(navigator.onLine?'err':'offline')}).then(()=>{pc--});return q};
const push=()=>{if(!on())return;clearTimeout(tm);tm=setTimeout(()=>run(flush),800)};
async function firstSync(){
 set('sync');
 if(cfg.proj!==cfg.url){snap={};cur='';cfg.proj=cfg.url}
 if(!Object.keys(snap).length&&!cur){
  const r=await api('/rest/v1/sync_records?select=id&limit=1'),rows=r.ok?await r.json():[];
  if(rows.length&&confirm('Des données existent déjà en ligne.\n\nOK : récupérer les données en ligne sur cet appareil (les données de cet appareil seront remplacées).\nAnnuler : envoyer les données de cet appareil vers le cloud (peut écraser des enregistrements en ligne de même numéro).')){
   try{localStorage.setItem('sk_db_v1_avant_synchro',JSON.stringify(DB))}catch(x){}
   COL.forEach(c=>DB[c]=[]);DB.cnt={};nz();snap={};const it=items();for(const k in it)snap[k]=hs(it[k])}}
 save();await cycle()}
async function login(sg){
 const u=($('#sy_url').value||'').trim().replace(/\/+$/,''),k=$('#sy_key').value.trim(),em=$('#sy_em').value.trim(),pw=$('#sy_pw').value;
 if(!u||!k||!em||!pw){ok('Remplissez tous les champs.');return}
 cfg={...cfg,url:u,key:k,email:em,at:'',rt:''};
 try{
  const r=await fetch(u+'/auth/v1/'+(sg?'signup':'token?grant_type=password'),{method:'POST',headers:{apikey:k,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}),j=await r.json();
  if(!r.ok||!j.access_token){ok(sg&&r.ok?'Compte créé. Il doit être activé avant de pouvoir se connecter.':'Échec : '+(j.msg||j.error_description||j.message||r.status));save();return}
  cfg.at=j.access_token;cfg.rt=j.refresh_token;save();
  await firstSync();set('ok');go('backup');ok('Synchronisation activée ✔')
 }catch(x){console.warn(x);set('err');ok('Connexion impossible : vérifiez internet et les informations saisies.')}}
function reset(){
 try{localStorage.removeItem(K)}catch(x){}ld();
 if(on()){snap={};const it=items();for(const k in it)snap[k]=hs(it[k]);cur='';save();run(pull)}
 lock()}
function out(){cfg.at='';cfg.rt='';save();set('off');go('backup')}
function card(){const o=on();
 return`<h2 class="sh">☁ Synchronisation en ligne</h2><div class="card">`+(o
 ?`<p><b>Connecté :</b> ${e(cfg.email)} — <span id="syst2">${lab()}</span></p><p>Les modifications sont envoyées automatiquement et reçues sur tous les appareils connectés au même compte (vérification toutes les 4 secondes). Sans internet, le logiciel continue de fonctionner et se met à jour au retour du réseau.</p><div class="ac" style="justify-content:flex-start"><button class="b1" onclick="SY.now()">Synchroniser maintenant</button><button class="b2" onclick="SY.out()">Se déconnecter</button></div>`
 :`<p>Connectez cet appareil au compte en ligne de l’entreprise pour partager les données entre téléphones et ordinateurs. Utilisez le même compte sur tous les appareils.</p><label>Adresse du projet<input id="sy_url" class="in" value="${e(cfg.url)}"></label><label>Clé publique (anon / publishable)<input id="sy_key" class="in" value="${e(cfg.key||'')}"></label><label>E-mail du compte<input id="sy_em" class="in" type="email" value="${e(cfg.email||'')}"></label><label>Mot de passe<input id="sy_pw" class="in" type="password"></label><div class="ac" style="justify-content:flex-start"><button class="b1" onclick="SY.login(false)">Se connecter</button><button class="b2" onclick="SY.login(true)">Créer le compte</button></div>`)+`</div>`}
function start(){
 setInterval(()=>{if(on()&&!document.hidden&&navigator.onLine&&!pc)run(cycle)},4000);
 addEventListener('online',()=>on()&&run(cycle));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&on())run(cycle)});
 if(on())run(cycle)}
return{push,on,lab,card,login,reset,out,start,now:()=>{if(on()){run(cycle);ok('Synchronisation lancée')}}}})();

ld();$('#kpd').innerHTML=['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button onclick="kk('${k}')">${k}</button>`).join('');lock();SY.start();
